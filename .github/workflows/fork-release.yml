name: Fork Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Minimal at workflow scope; the build job elevates to the writes it actually
# needs (release upload + attestation). Keeps workflow_dispatch dry-runs read-only.
permissions:
  contents: read

env:
  CREATE_DMG_VERSION: 8.0.0

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write       # Create GitHub Release + upload the DMG asset
      id-token: write       # OIDC token for build-provenance attestation
      attestations: write   # write the attestation to the repo's attestation store
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0   # full history so the upstream base commit (an ancestor
                           # of the rebased HEAD) is present for the release-notes diff
          persist-credentials: false   # no later step needs authenticated git; keep
                                       # the write-scoped token out of .git/config

      - name: Verify tag matches MARKETING_VERSION and uses fork suffix
        if: github.event_name == 'push'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${REF_NAME#v}"
          PROJ=$(grep -m1 'MARKETING_VERSION = ' cmux.xcodeproj/project.pbxproj | sed 's/.*= //;s/;.*//')
          if [ "$TAG" != "$PROJ" ]; then
            echo "Tag '$TAG' does not match MARKETING_VERSION '$PROJ' in project.pbxproj." >&2
            echo "Run ./scripts/bump-version.sh <version> and commit before tagging." >&2
            exit 1
          fi
          case "$TAG" in
            [0-9]*.[0-9]*.[0-9]*-sb.[0-9]*) ;;
            *)
              echo "Tag '$TAG' must match X.Y.Z-sb.N (fork-suffix convention)." >&2
              exit 1
              ;;
          esac

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ -d "/Applications/Xcode.app/Contents/Developer" ]; then
            XCODE_DIR="/Applications/Xcode.app/Contents/Developer"
          else
            XCODE_APP="$(
              find /Applications -maxdepth 1 -name 'Xcode*.app' -print 2>/dev/null \
                | sort \
                | tail -n 1 \
                || true
            )"
            if [ -n "$XCODE_APP" ]; then
              XCODE_DIR="$XCODE_APP/Contents/Developer"
            else
              echo "No Xcode.app found under /Applications" >&2
              exit 1
            fi
          fi
          echo "DEVELOPER_DIR=$XCODE_DIR" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$XCODE_DIR"
          xcodebuild -version

      - name: Install build deps
        run: |
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          export HOMEBREW_NO_ENV_HINTS=1
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          if ! command -v rustup >/dev/null 2>&1; then
            brew install rustup-init
            rustup-init -y --profile minimal --default-toolchain stable
          fi
          if ! rustup show active-toolchain >/dev/null 2>&1; then
            rustup default stable
          fi
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          ./scripts/install-zig-ci.sh
          npm install --global "create-dmg@${CREATE_DMG_VERSION}"

      - name: Download pre-built GhosttyKit.xcframework
        run: ./scripts/download-prebuilt-ghosttykit.sh

      - name: Cache Swift packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .spm-cache
          key: spm-${{ hashFiles('cmux.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-

      - name: Build universal Release (unsigned)
        run: |
          xcodebuild -scheme cmux -configuration Release -derivedDataPath build-universal \
            -destination 'generic/platform=macOS' \
            -clonedSourcePackagesDirPath .spm-cache \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO build

      - name: Verify universal binaries
        run: |
          set -euo pipefail
          APP="build-universal/Build/Products/Release/cmux.app"
          for binary in \
            "$APP/Contents/MacOS/cmux" \
            "$APP/Contents/Resources/bin/cmux" \
            "$APP/Contents/Resources/bin/ghostty"; do
            [ -e "$binary" ] || { echo "missing $binary" >&2; exit 1; }
            ARCHS="$(lipo -archs "$binary")"
            echo "$binary: $ARCHS"
            case "$ARCHS" in
              *arm64*x86_64*|*x86_64*arm64*) ;;
              *) echo "missing arch in $binary: $ARCHS" >&2; exit 1 ;;
            esac
          done

      - name: Disable Sparkle auto-update
        # The fork inherits upstream's bundled SUFeedURL and SUPublicEDKey. Left in
        # place, the fork would silently pull upstream-signed updates and replace
        # the fork build with vanilla upstream, losing the carried patch. Brew is
        # the update mechanism for this fork; Sparkle must be inert.
        run: |
          set -euo pipefail
          APP_PLIST="build-universal/Build/Products/Release/cmux.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :SUFeedURL" "$APP_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Delete :SUPublicEDKey" "$APP_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Set :SUEnableAutomaticChecks false" "$APP_PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :SUEnableAutomaticChecks bool false" "$APP_PLIST"
          /usr/libexec/PlistBuddy -c "Print :SUEnableAutomaticChecks" "$APP_PLIST"
          # Assert the critical invariant actually held. The deletes above swallow
          # errors (so an absent key isn't fatal), which means a future Info.plist
          # refactor could make them silently no-op and still ship a fork that can
          # auto-update to upstream. Fail the build if either key survived.
          for k in SUFeedURL SUPublicEDKey; do
            if /usr/libexec/PlistBuddy -c "Print :$k" "$APP_PLIST" >/dev/null 2>&1; then
              echo "FATAL: $k still present after strip — would allow silent upstream replacement" >&2
              exit 1
            fi
          done

      - name: Ad-hoc codesign
        run: |
          set -euo pipefail
          APP="build-universal/Build/Products/Release/cmux.app"
          xattr -cr "$APP" || true
          codesign --force --deep --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict "$APP"

      - name: Package DMG
        run: |
          set -euo pipefail
          APP="build-universal/Build/Products/Release/cmux.app"
          create-dmg "$APP" ./ || true
          ls -1 ./cmux*.dmg
          mv ./cmux*.dmg cmux-macos.dmg
          ls -lh cmux-macos.dmg

      - name: Attest build provenance
        # Binds cmux-macos.dmg to this workflow run via GitHub OIDC. Users can then
        # `gh attestation verify cmux-macos.dmg --repo sbourass/cmux` — an integrity
        # anchor independent of the Homebrew tap (no Apple Developer account needed).
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: cmux-macos.dmg

      - name: Build release notes
        # Distinguish the fork's own commits from the folded-in upstream rebase.
        # The fork repo does not carry upstream's base tags, so resolve the upstream
        # base commit SHA directly from upstream; the rebased HEAD has it as an
        # ancestor (Checkout uses fetch-depth: 0), making BASE_SHA..HEAD exactly the
        # fork commits on top of that base.
        if: github.event_name == 'push'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          BASE="v$(echo "${REF_NAME#v}" | sed 's/-sb\..*//')"
          BASE_SHA="$(git ls-remote https://github.com/manaflow-ai/cmux "refs/tags/${BASE}^{}" | cut -f1)"
          if [ -z "$BASE_SHA" ]; then
            # Lightweight (unannotated) tag has no peeled ^{} ref; fall back to the tag itself.
            BASE_SHA="$(git ls-remote https://github.com/manaflow-ai/cmux "refs/tags/${BASE}" | cut -f1)"
          fi
          if [ -z "$BASE_SHA" ]; then
            echo "FATAL: could not resolve upstream base commit for ${BASE} — refusing to emit empty notes" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$BASE_SHA" HEAD; then
            echo "FATAL: upstream base ${BASE} (${BASE_SHA}) is not an ancestor of HEAD — was sb-main rebased onto it?" >&2
            exit 1
          fi
          {
            echo "Personal fork build of [manaflow-ai/cmux](https://github.com/manaflow-ai/cmux) — ad-hoc signed, **not** Apple-notarized."
            echo
            echo "**Upstream base:** \`${BASE}\` — [upstream changelog](https://github.com/manaflow-ai/cmux/releases/tag/${BASE})"
            echo
            echo "**Changes in this fork build on top of \`${BASE}\`** (curated index: \`docs/patches.md\`):"
            echo
            git log --reverse --pretty='- %s' --no-merges "${BASE_SHA}..HEAD"
            echo
            echo "Update via \`brew upgrade --cask sbourass/cmux/cmux\`."
            echo
            echo "Verify provenance: \`gh attestation verify cmux-macos.dmg --repo sbourass/cmux\`"
            echo
            echo "On first launch macOS will refuse to open the app. Right-click \`cmux.app\` → Open, or clear quarantine:"
            echo
            echo '```'
            echo "xattr -dr com.apple.quarantine /Applications/cmux.app"
            echo '```'
          } > notes.md
          echo "--- generated notes.md ---"
          cat notes.md

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: cmux-macos.dmg
          name: ${{ github.ref_name }} (fork build)
          body_path: notes.md
          generate_release_notes: false
          fail_on_unmatched_files: true

      - name: Upload artifact (dry-run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-macos
          path: cmux-macos.dmg
          if-no-files-found: error
